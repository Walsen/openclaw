[project]
name = "openclaw-agentcore"
version = "0.1.0"
description = "OpenClaw agent container for Amazon Bedrock AgentCore Runtime"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.38.0",
    "requests>=2.33.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.0",
    "pytest>=9.0.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",
    "F401",
    "E402",
]

[tool.ruff.lint.per-file-ignores]
"auth-agent/*" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]

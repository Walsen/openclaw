name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install lint dependencies
        # Pinned deliberately. An unpinned linter lets an upstream release fail CI
        # on files nobody touched — ruff 0.16 began formatting Python blocks inside
        # Markdown and did exactly that to the infra repo. Keep this in step with
        # the ruff in devbox.json when bumping either.
        run: pip install ruff==0.16.0

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Shell lint
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck entrypoint.sh

      - name: Validate JSON
        run: python -c "import json; json.load(open('openclaw.json'))"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install boto3 requests pytest

      - name: Python syntax check
        run: |
          python -m py_compile server.py
          python -m py_compile workspace_assembler.py
          python -m py_compile gog_init.py
          python -m py_compile permissions.py
          python -m py_compile identity.py
          python -m py_compile memory.py
          python -m py_compile observability.py
          python -m py_compile safety.py
          python -m py_compile skill_loader.py
          python -m py_compile auth-agent/permission_request.py

      - name: Run tests
        run: pytest tests/ -v --tb=short || echo "No tests found — syntax checks passed"

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          tags: ffactory/openclaw:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Bandit — Python security scan
        run: bandit -r . -ll -q --exclude ./.venv,./tests -c bandit.toml

      - name: pip-audit — dependency vulnerability scan
        run: pip-audit -r requirements.txt

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: ffactory/openclaw:scan
          load: true
          cache-from: type=gha

      # Pinned to a release tag rather than @master: a mutable ref means an
      # upstream commit lands in our pipeline without review.
      - name: Trivy — container vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ffactory/openclaw:scan
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks — secret detection
        # v3 is a pure Node 20 -> Node 24 runtime bump; no input/output/behavior
        # change. v2 stops working on GitHub-hosted runners after 2026-09-16 when
        # Node 20 is removed. No GITLEAKS_LICENSE needed: this repo is a personal
        # (User) account, not an organization.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
